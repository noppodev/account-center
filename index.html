<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理 - Noppo Auth</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #0052ff;
            --accent-hover: #0040cc;
            --danger: #ff4444;
            --danger-hover: #cc0000;
            --glass: rgba(255, 255, 255, 0.72);
            --border: rgba(0, 0, 0, 0.08);
            --text-primary: #1a1a1a;
            --text-secondary: #6e6e73;
            --success: #00cc00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            background-color: #fbfbfd;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .gradient-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(at 0% 0%, #e8f0ff 0%, transparent 50%),
                        radial-gradient(at 100% 100%, #fdf2ff 0%, transparent 50%);
        }

        .container {
            display: flex;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            gap: 24px;
        }

        /* サイドバー */
        .sidebar {
            width: 280px;
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 48px);
            position: sticky;
            top: 24px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
        }

        .sidebar-header h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .nav-item:hover {
            background: rgba(0, 82, 255, 0.08);
            color: var(--accent);
        }

        .nav-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
        }

        .nav-item svg {
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .logout-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--danger);
            background: rgba(255, 68, 68, 0.08);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* メインコンテンツ */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .content-section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 24px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .card h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        /* アバターセクション */
        .avatar-section {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), #0066ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(0, 82, 255, 0.2);
            border: 4px solid white;
            overflow: hidden;
        }

        .avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* フォーム */
        .form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
            outline: none;
        }

        .input:focus {
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 82, 255, 0.1);
        }

        .input:disabled {
            background: rgba(0, 0, 0, 0.04);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ボタン */
        .btn-primary {
            padding: 14px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 82, 255, 0.2);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            padding: 10px 20px;
            background: white;
            color: var(--text-primary);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-danger {
            padding: 14px 24px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.2);
        }

        /* パスワード強度 */
        .password-strength {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

        .strength-bar {
            flex: 1;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
        }

        .strength-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* 危険な操作カード */
        .danger-card {
            border: 2px solid var(--danger);
        }

        .danger-card h3 {
            color: var(--danger);
        }

        .warning-text {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        /* トースト通知 */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 16px;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: static;
            }
            
            .sidebar-nav {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 8px;
            }
            
            .nav-item {
                white-space: nowrap;
            }
            
            .avatar-section {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    
    <div class="container">
        <!-- サイドバー -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
                        <path d="M2 17L12 22L22 17"/>
                        <path d="M2 12L12 17L22 12"/>
                    </svg>
                </div>
                <h1>Noppo Auth</h1>
            </div>
            
            <nav class="sidebar-nav">
                <button class="nav-item active" data-section="profile">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    プロフィール
                </button>
                <button class="nav-item" data-section="security">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    セキュリティ
                </button>
                <button class="nav-item" data-section="danger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    危険な操作
                </button>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" onclick="logout()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    ログアウト
                </button>
            </div>
        </aside>
        
        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- プロフィールセクション -->
            <section id="section-profile" class="content-section active">
                <h2 class="section-title">プロフィール設定</h2>
                
                <div class="card">
                    <div class="avatar-section">
                        <div class="avatar-large" id="current-avatar">
                            <span id="avatar-initial">?</span>
                        </div>
                        <div class="avatar-actions">
                            <button class="btn-secondary" onclick="changeAvatar()">アバター変更</button>
                            <input type="file" id="avatar-input" accept="image/*" style="display: none;">
                        </div>
                    </div>
                    
                    <form class="form" onsubmit="updateProfile(event)">
                        <div class="form-group">
                            <label>表示名</label>
                            <input type="text" id="display-name" class="input" placeholder="ニックネーム">
                        </div>
                        
                        <div class="form-group">
                            <label>メールアドレス</label>
                            <input type="email" id="email" class="input" disabled>
                            <small class="hint">メールアドレスを変更するにはセキュリティ設定へ</small>
                        </div>
                        
                        <div class="form-group">
                            <label>ユーザーID</label>
                            <input type="text" id="user-id" class="input" disabled>
                        </div>
                        
                        <div class="form-group">
                            <label>登録日</label>
                            <input type="text" id="created-at" class="input" disabled>
                        </div>
                        
                        <div class="form-group">
                            <label>最終ログイン</label>
                            <input type="text" id="last-sign-in" class="input" disabled>
                        </div>
                        
                        <button type="submit" class="btn-primary">変更を保存</button>
                    </form>
                </div>
            </section>
            
            <!-- セキュリティセクション -->
            <section id="section-security" class="content-section">
                <h2 class="section-title">セキュリティ設定</h2>
                
                <div class="card">
                    <h3>パスワード変更</h3>
                    <form class="form" onsubmit="changePassword(event)">
                        <div class="form-group">
                            <label>現在のパスワード</label>
                            <input type="password" id="current-password" class="input" required>
                        </div>
                        
                        <div class="form-group">
                            <label>新しいパスワード</label>
                            <input type="password" id="new-password" class="input" required oninput="checkPasswordStrength(this.value)">
                            <div class="password-strength">
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strength-fill"></div>
                                </div>
                                <span class="strength-text" id="strength-text">強度: -</span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>新しいパスワード（確認）</label>
                            <input type="password" id="confirm-password" class="input" required>
                        </div>
                        
                        <button type="submit" class="btn-primary">パスワードを変更</button>
                    </form>
                </div>
                
                <div class="card">
                    <h3>メールアドレス変更</h3>
                    <form class="form" onsubmit="changeEmail(event)">
                        <div class="form-group">
                            <label>現在のパスワード</label>
                            <input type="password" id="email-password" class="input" required>
                        </div>
                        
                        <div class="form-group">
                            <label>新しいメールアドレス</label>
                            <input type="email" id="new-email" class="input" required>
                        </div>
                        
                        <button type="submit" class="btn-primary">メールアドレスを変更</button>
                    </form>
                </div>
            </section>
            
            <!-- 危険な操作セクション -->
            <section id="section-danger" class="content-section">
                <h2 class="section-title">危険な操作</h2>
                
                <div class="card danger-card">
                    <h3>アカウント削除</h3>
                    <p class="warning-text">
                        アカウントを削除すると、すべてのデータが永久に失われます。
                        この操作は取り消せません。
                    </p>
                    
                    <form class="form" onsubmit="deleteAccount(event)">
                        <div class="form-group">
                            <label>削除を確認するために「DELETE」と入力してください</label>
                            <input type="text" id="delete-confirm" class="input" required>
                        </div>
                        
                        <div class="form-group">
                            <label>パスワード</label>
                            <input type="password" id="delete-password" class="input" required>
                        </div>
                        
                        <button type="submit" class="btn-danger">アカウントを削除</button>
                    </form>
                </div>
            </section>
        </main>
    </div>
    
    <!-- トースト通知 -->
    <div class="toast" id="toast"></div>
    
    <script>
        // 設定
        const AUTH_URL = "https://noppo-auth.noppo5319.workers.dev";
        const SUPABASE_URL = "https://vvavasrdxguqkiigcxkl.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YXZhc3JkeGd1cWtpaWdjeGtsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0MTk5ODcsImV4cCI6MjA4Mjk5NTk4N30.CVq3lyRbxek7Ejs4tP5sN9-0JNEXSLtCsC2Pj-skFFQ";

        let currentUser = null;
        let currentTicket = null;
        let accessToken = null;

        // 初期化
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentTicket = urlParams.get('ticket');
            
            if (!currentTicket) {
                // チケットがない場合、ログインページへ
                window.location.href = AUTH_URL + '?redirect=' + encodeURIComponent(window.location.href);
                return;
            }
            
            await loadUserInfo();
            setupNavigation();
        }

        // ユーザー情報取得
        async function loadUserInfo() {
            try {
                const res = await fetch(`${AUTH_URL}/auth/v1/user?ticket=${currentTicket}`, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (res.ok) {
                    currentUser = await res.json();
                    accessToken = currentTicket; // チケットをアクセストークンとして使用
                    displayUserInfo();
                } else {
                    showToast('ユーザー情報の取得に失敗しました', 'error');
                }
            } catch (e) {
                console.error('ユーザー情報取得エラー:', e);
                showToast('通信エラーが発生しました', 'error');
            }
        }

        // ユーザー情報表示
        function displayUserInfo() {
            if (!currentUser) return;
            
            // 表示名
            document.getElementById('display-name').value = currentUser.userId || '';
            
            // メールアドレス
            document.getElementById('email').value = currentUser.email || '';
            
            // ユーザーID
            document.getElementById('user-id').value = currentUser.raw?.id || '';
            
            // 登録日
            const createdAt = currentUser.raw?.created_at ? new Date(currentUser.raw.created_at).toLocaleString('ja-JP') : '-';
            document.getElementById('created-at').value = createdAt;
            
            // 最終ログイン
            const lastSignIn = currentUser.raw?.last_sign_in_at ? new Date(currentUser.raw.last_sign_in_at).toLocaleString('ja-JP') : '-';
            document.getElementById('last-sign-in').value = lastSignIn;
            
            // アバター
            const avatarInitial = document.getElementById('avatar-initial');
            if (currentUser.avatar) {
                document.getElementById('current-avatar').innerHTML = 
                    `<img src="${currentUser.avatar}" alt="アバター">`;
            } else {
                avatarInitial.textContent = (currentUser.userId || currentUser.email || '?').charAt(0).toUpperCase();
            }
        }

        // ナビゲーション設定
        function setupNavigation() {
            const navItems = document.querySelectorAll('.nav-item');
            const sections = document.querySelectorAll('.content-section');
            
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const sectionId = item.dataset.section;
                    
                    // ナビゲーションのアクティブ状態
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    
                    // セクションの表示
                    sections.forEach(section => section.classList.remove('active'));
                    document.getElementById(`section-${sectionId}`).classList.add('active');
                });
            });
        }

        // プロフィール更新
        async function updateProfile(event) {
            event.preventDefault();
            
            const displayName = document.getElementById('display-name').value;
            
            try {
                const res = await fetch(AUTH_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'update_profile',
                        ticket: currentTicket,
                        displayName: displayName
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    currentUser.userId = displayName;
                    displayUserInfo();
                    showToast('プロフィールを更新しました', 'success');
                } else {
                    showToast('プロフィールの更新に失敗しました', 'error');
                }
            } catch (e) {
                console.error('プロフィール更新エラー:', e);
                showToast('通信エラーが発生しました', 'error');
            }
        }

        // パスワード変更
        async function changePassword(event) {
            event.preventDefault();
            
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                showToast('パスワードが一致しません', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showToast('パスワードは6文字以上必要です', 'error');
                return;
            }
            
            try {
                const res = await fetch(AUTH_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'change_password',
                        ticket: currentTicket,
                        currentPassword: currentPassword,
                        newPassword: newPassword
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    // フォームをリセット
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                    document.getElementById('confirm-password').value = '';
                    document.getElementById('strength-fill').style.width = '0%';
                    document.getElementById('strength-text').textContent = '強度: -';
                    
                    showToast('パスワードを変更しました', 'success');
                } else {
                    showToast(data.message || 'パスワードの変更に失敗しました', 'error');
                }
            } catch (e) {
                console.error('パスワード変更エラー:', e);
                showToast('通信エラーが発生しました', 'error');
            }
        }

        // メールアドレス変更
        async function changeEmail(event) {
            event.preventDefault();
            
            const password = document.getElementById('email-password').value;
            const newEmail = document.getElementById('new-email').value;
            
            try {
                const res = await fetch(AUTH_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'change_email',
                        ticket: currentTicket,
                        password: password,
                        newEmail: newEmail
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    // フォームをリセット
                    document.getElementById('email-password').value = '';
                    document.getElementById('new-email').value = '';
                    
                    showToast('確認メールを送信しました', 'success');
                } else {
                    showToast(data.message || 'メールアドレスの変更に失敗しました', 'error');
                }
            } catch (e) {
                console.error('メールアドレス変更エラー:', e);
                showToast('通信エラーが発生しました', 'error');
            }
        }

        // パスワード強度チェック
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const colors = ['#ff4444', '#ff8800', '#ffcc00', '#00cc00'];
            const texts = ['低', '中', '高', '非常に高'];
            
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');
            
            fill.style.width = (strength * 25) + '%';
            fill.style.backgroundColor = colors[strength];
            text.textContent = '強度: ' + texts[strength];
        }

        // アバター変更
        function changeAvatar() {
            document.getElementById('avatar-input').click();
        }

        document.getElementById('avatar-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('current-avatar').innerHTML = 
                        `<img src="${event.target.result}" alt="アバター">`;
                    showToast('アバターを変更しました（デモ用）', 'success');
                };
                reader.readAsDataURL(file);
            }
        });

        // セッション終了
        async function revokeAllSessions() {
            if (!confirm('すべてのセッションを終了しますか？')) {
                return;
            }
            
            try {
                const res = await fetch(`${AUTH_URL}/logout?ticket=${currentTicket}`, {
                    method: 'GET'
                });
                
                if (res.ok) {
                    showToast('すべてのセッションを終了しました', 'success');
                    // ログインページへ
                    setTimeout(() => {
                        window.location.href = AUTH_URL + '?redirect=' + encodeURIComponent(window.location.href);
                    }, 2000);
                } else {
                    showToast('セッションの終了に失敗しました', 'error');
                }
            } catch (e) {
                console.error('セッション終了エラー:', e);
                showToast('通信エラーが発生しました', 'error');
            }
        }

        // アカウント削除
        async function deleteAccount(event) {
            event.preventDefault();
            
            const confirmText = document.getElementById('delete-confirm').value;
            const password = document.getElementById('delete-password').value;
            
            if (confirmText !== 'DELETE') {
                showToast('「DELETE」と入力してください', 'error');
                return;
            }
            
            if (!confirm('本当にアカウントを削除しますか？この操作は取り消せません。')) {
                return;
            }
            
            try {
                const res = await fetch(AUTH_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'delete_account',
                        ticket: currentTicket,
                        password: password
                    })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    showToast('アカウントを削除しました', 'success');
                    setTimeout(() => {
                        window.location.href = AUTH_URL;
                    }, 2000);
                } else {
                    showToast(data.message || 'アカウント削除に失敗しました', 'error');
                }
            } catch (e) {
                console.error('アカウント削除エラー:', e);
                showToast('通信エラーが発生しました', 'error');
            }
        }

        // ログアウト
        function logout() {
            window.location.href = `${AUTH_URL}/logout?redirect=${encodeURIComponent(window.location.origin)}`;
        }

        // トースト通知
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ページ読み込み時に初期化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
